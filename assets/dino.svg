<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Chrome dino jumping over cacti">
  <style>
    .pixel { fill: #535353; }
    .eye   { fill: #fff;    }
    .mouth { fill: #fff;    }
    .ground { stroke: #535353; stroke-width: 2; fill: none; }
    .speck  { fill: #535353; }

    @media (prefers-color-scheme: dark) {
      .pixel, .speck { fill: #c6c6c6; }
      .ground { stroke: #c6c6c6; }
      .eye    { fill: #1a1a1a; }
      .mouth  { fill: #1a1a1a; }
    }

    .dino {
      transform-origin: center;
      transform-box: fill-box;
      animation: jump 1.6s cubic-bezier(0.25, 0, 0.25, 1) infinite;
    }
    @keyframes jump {
      0%, 55%, 100% { transform: translateY(0); }
      20%, 35%      { transform: translateY(-72px); }
    }

    .cactus  { animation: scroll 3.2s linear infinite; }
    .cactus2 { animation: scroll 3.2s linear infinite; animation-delay: 1.6s; }
    @keyframes scroll {
      from { transform: translateX(800px); }
      to   { transform: translateX(-80px); }
    }

    .speck  { animation: scroll 2.4s linear infinite; }
    .speck2 { animation: scroll 2.4s linear infinite; animation-delay: 1.2s; }
  </style>

  <!-- Ground -->
  <line class="ground" x1="0" y1="170" x2="800" y2="170" />

  <!-- Ground specks -->
  <g class="speck">
    <rect class="speck" x="0" y="175" width="6" height="2" />
    <rect class="speck" x="40" y="178" width="3" height="2" />
  </g>
  <g class="speck2">
    <rect class="speck" x="0" y="176" width="4" height="2" />
    <rect class="speck" x="60" y="174" width="5" height="2" />
  </g>

  <!-- Dino (stylized pixel T-Rex) -->
  <g class="dino" transform="translate(90, 80)">
    <!-- Tail tip -->
    <rect class="pixel" x="0"  y="36" width="8"  height="6" />
    <!-- Tail -->
    <rect class="pixel" x="8"  y="30" width="14" height="12" />
    <!-- Back / body -->
    <rect class="pixel" x="22" y="20" width="30" height="50" />
    <!-- Neck -->
    <rect class="pixel" x="44" y="10" width="14" height="14" />
    <!-- Head -->
    <rect class="pixel" x="48" y="0"  width="36" height="22" />
    <!-- Head bottom (jaw) -->
    <rect class="pixel" x="58" y="22" width="22" height="6" />
    <!-- Eye -->
    <rect class="eye"   x="72" y="6"  width="4"  height="4" />
    <!-- Mouth slot -->
    <rect class="mouth" x="76" y="18" width="4"  height="2" />
    <!-- Front arm -->
    <rect class="pixel" x="48" y="42" width="8"  height="4" />
    <!-- Legs -->
    <rect class="pixel" x="24" y="70" width="10" height="14" />
    <rect class="pixel" x="40" y="70" width="10" height="14" />
    <!-- Feet -->
    <rect class="pixel" x="22" y="84" width="14" height="4" />
    <rect class="pixel" x="38" y="84" width="14" height="4" />
  </g>

  <!-- Cactus 1 (tall) -->
  <g class="cactus">
    <rect class="pixel" x="0"   y="120" width="12" height="50" />
    <rect class="pixel" x="-10" y="135" width="10" height="22" />
    <rect class="pixel" x="-16" y="138" width="6"  height="16" />
    <rect class="pixel" x="12"  y="128" width="10" height="30" />
    <rect class="pixel" x="22"  y="132" width="6"  height="22" />
  </g>

  <!-- Cactus 2 (smaller cluster) -->
  <g class="cactus2">
    <rect class="pixel" x="0"  y="140" width="10" height="30" />
    <rect class="pixel" x="-6" y="148" width="6"  height="18" />
    <rect class="pixel" x="10" y="146" width="6"  height="20" />
  </g>
</svg>
